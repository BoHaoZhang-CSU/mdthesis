<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown转毕业论文docx</title>
<style>
  :root {
    --bg:#ffffff; --ink:#1a1a1a; --muted:#6e6e73;
    --line:#d8dade; --soft:#fafafa;
    --accent:#8b1a1a; --accent-h:#6f1414;
    --ok:#166534; --warn:#92400e; --err:#9b1c1c;
  }
  /* 全站不使用圆角 —— 直角更克制、更像正式工具 */
  * { box-sizing:border-box; border-radius:0; }
  body {
    margin:0; padding:56px 24px 96px; color:var(--ink); background:var(--bg);
    font:15px/1.8 -apple-system,"Noto Sans CJK SC","Source Han Sans SC",
         "Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:660px; margin:0 auto; position:relative; }

  /* 右上角仓库入口：和「粘贴」一样是次要入口 —— 默认淡灰，悬停才变红，不跟标题抢 */
  .gh { position:absolute; top:0; right:0; color:var(--muted); line-height:0; }
  .gh:hover { color:var(--accent); }

  h1 {
    font-size:22px; font-weight:600; letter-spacing:.5px; text-align:center;
    margin:0 0 28px; padding-bottom:16px; border-bottom:2px solid var(--ink);
  }

  .card { padding:0; }

  /* 拖拽区：空态时是页面主角（大、居中）；有文件后收成一行，
     把视觉重心让给文件列表和转换按钮 —— 一屏只有一个重点。 */
  #drop {
    border:1px solid var(--line); padding:48px 24px; text-align:center;
    cursor:pointer; transition:border-color .15s, background .15s, padding .15s;
    background:var(--soft);
  }
  #drop:hover, #drop.over { border-color:var(--accent); background:#fff; }
  #drop .big { font-size:15px; }
  #drop .small { color:var(--muted); font-size:12.5px; margin-top:6px; }
  #drop.compact { padding:12px 16px; text-align:left; border-top:none; background:#fff; }
  #drop.compact .big { font-size:13px; color:var(--muted); }
  #drop.compact .small { display:none; }
  #drop.compact:hover { color:var(--accent); }

  /* 粘贴入口默认收起 —— 不占默认视图，需要的人点开 */
  #pasteBox { margin-top:14px; text-align:center; }
  /* 次要入口：用灰色，别和主按钮抢视线（悬停时才变红） */
  #pasteToggle { font-size:12.5px; color:var(--muted); }
  #pasteToggle:hover { color:var(--accent); }
  #pastePanel { margin-top:12px; text-align:left; }
  #pasteText {
    width:100%; height:220px; resize:vertical; padding:10px 12px;
    font:12.5px/1.7 ui-monospace,Menlo,Consolas,monospace;
    color:var(--ink); background:#fff; border:1px solid var(--line);
  }
  #pasteText:focus { outline:none; border-color:var(--accent); }
  .paste-foot { display:flex; align-items:center; gap:12px; margin-top:10px; flex-wrap:wrap; }
  #pasteAdd {
    padding:9px 18px; font:inherit; font-size:14px; color:#fff;
    background:var(--accent); border:1px solid var(--accent); cursor:pointer;
  }
  #pasteAdd:hover { background:var(--accent-h); border-color:var(--accent-h); }
  .paste-foot .hint { font-size:12px; color:var(--muted); flex:1; min-width:180px; }

  #list { margin-top:14px; border:1px solid var(--line); }
  #list:empty { display:none; border:none; }
  .item {
    display:flex; align-items:center; gap:12px;
    padding:12px 16px; font-size:14px;
    border-bottom:1px solid var(--line);
  }
  .item:last-child { border-bottom:none; }
  .item:hover { background:var(--soft); }
  .item input[type=checkbox] { width:15px; height:15px; flex:none; cursor:pointer;
                               accent-color:var(--accent); }
  .item .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
                white-space:nowrap; }
  .item .meta { flex:none; color:var(--muted); font-size:12.5px; }
  .item.done .name { color:var(--muted); }
  .item.done .name::after { content:" 已转换"; color:var(--ok); font-size:12px; }
  .item .x { flex:none; color:#c9ccd1; cursor:pointer; font-size:16px; line-height:1;
             padding:0 2px; }
  .item .x:hover { color:var(--err); }

  /* 主动作按钮：整页最重的一块。有文件时它才是焦点。 */
  #go {
    display:block; width:100%; margin-top:16px; padding:16px;
    font:inherit; font-size:16px; font-weight:600; letter-spacing:1.5px;
    color:#fff; background:var(--accent); border:1px solid var(--accent);
    cursor:pointer; transition:background .15s;
  }
  #go:hover:not(:disabled) { background:var(--accent-h); border-color:var(--accent-h); }
  #go:disabled { background:#eceef1; border-color:var(--line); color:#a8adb5;
                 cursor:not-allowed; }

  .foot {
    margin-top:28px; padding-top:16px; border-top:1px solid var(--line);
    font-size:12.5px; color:var(--muted);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    flex-wrap:wrap;
  }
  .foot b { color:var(--ink); font-weight:500; }
  .foot input[type=file] { display:none; }
  .link { color:var(--accent); cursor:pointer; }
  .link:hover { text-decoration:underline; }

  /* 状态区：成功只给一行，细节默认收起。失败才摊开。 */
  #status { margin-top:16px; font-size:12.5px; line-height:1.8; color:var(--muted);
            white-space:pre-wrap; }
  #status:empty { display:none; }
  #status .line { padding:2px 0; }
  #status .line.ok  { color:var(--ok); }
  #status .line.err { color:var(--err); }
  #status .line.ok::before  { content:"✓ "; }
  #status .line.err::before { content:"✕ "; }
  #status .tog { color:var(--muted); cursor:pointer; text-decoration:underline;
                 font-size:12px; }
  #status .tog:hover { color:var(--ink); }
  #status .flag { color:var(--warn); font-size:12px; }
  #status .more { padding:6px 0 2px 14px; border-left:2px solid var(--line);
                  margin-left:2px; }
  #status .more ul { margin:2px 0 4px; padding-left:18px; }
  #status .more li { margin:2px 0; }
  #status .more b { color:var(--ink); font-weight:500; }
  #status a { color:var(--accent); }
  #status .fname { color:var(--ink); }
</style>
</head>
<body>
<div class="wrap">

  <a class="gh" href="https://github.com/BoHaoZhang-CSU/mdthesis" target="_blank" rel="noopener"
     title="项目仓库（GitHub）" aria-label="GitHub 项目仓库">
    <svg viewBox="0 0 16 16" width="26" height="26" fill="currentColor" aria-hidden="true">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
    </svg>
  </a>

  <h1>Markdown转毕业论文docx</h1>

  <div class="card">

    <div id="list"></div>

    <!-- 添加区放在文件列表**下面**：已经加过文件之后，视觉重心是列表本身，
         添加入口退到下面（空态时列表不占位，这里就顶在最上面，和以前一样） -->
    <div id="drop">
      <div class="big">拖拽 .md 文件到这里，可以一次拖多个</div>
      <div class="small">也可以点击选择文件</div>
    </div>
    <input type="file" id="mdFile" accept=".md,.markdown,.txt" multiple hidden>

    <div id="pasteBox">
      <a class="link" id="pasteToggle">▾ 或者直接粘贴 markdown 文本</a>
      <div id="pastePanel" hidden>
        <textarea id="pasteText" placeholder="把 markdown 粘在这里…"></textarea>
        <div class="paste-foot">
          <button id="pasteAdd" type="button">加入转换队列</button>
          <span class="hint">粘贴只带文字，文中的图片不会被转换。</span>
        </div>
      </div>
    </div>

    <button id="go" disabled>转换并下载 Word</button>

    <div class="foot">
      <span id="tplName"></span>
      <span>
        <input type="file" id="tplFile" accept=".docx">
        <a class="link" id="tplPick">用自己的模板</a>
        <a class="link" id="tplReset" style="display:none">改回默认</a>
      </span>
    </div>

    <div id="status"></div>

  </div>

</div>

<script>
const $ = id => document.getElementById(id);
let queue = [];              // {id, file, name, addedAt, checked, done}
let seq = 0, tplFile = null, defaultTpl = '', running = false;

const drop = $('drop');
const listEl = $('list');
const goBtn = $('go');

/* ---------- 选文件 ---------- */
drop.onclick = () => $('mdFile').click();
$('mdFile').onchange = () => {
  addFiles($('mdFile').files);
  $('mdFile').value = '';
};

function isMd(f) {
  if (!f) return false;
  if (/\.(md|markdown|txt)$/i.test(f.name)) return true;
  // 有些导出的文件没有扩展名，但 MIME 能认出来
  return /markdown/i.test(f.type || '') ||
         ((f.type === 'text/plain' || f.type === '') && f.size > 0 && f.size < 20 * 1024 * 1024);
}

/* 同名文件自动加 (2)(3) 后缀 —— 用户经常会重复拖同一个文件，
   不加的话列表里分不清，下载下来的 docx 也会互相覆盖。 */
function uniqueName(name) {
  const taken = new Set(queue.map(q => q.name));
  if (!taken.has(name)) return name;
  const dot = name.lastIndexOf('.');
  const base = dot > 0 ? name.slice(0, dot) : name;
  const ext = dot > 0 ? name.slice(dot) : '';
  for (let i = 2; ; i++) {
    const cand = base + ' (' + i + ')' + ext;
    if (!taken.has(cand)) return cand;
  }
}

/* 从 DataTransfer 里取文件。三种来源都试，取到为止：
   ① dataTransfer.files    标准路径
   ② dataTransfer.items    个别环境只填这个
   取不到就把「浏览器给的数据类型」返回出去，好定位是环境问题还是用法问题。 */
function filesFrom(dt) {
  if (!dt) return { files: [], types: '(没有 dataTransfer)' };
  let out = Array.from(dt.files || []);
  if (!out.length && dt.items && dt.items.length) {
    for (const it of dt.items) {
      if (it.kind === 'file') { const f = it.getAsFile(); if (f) out.push(f); }
    }
  }
  const types = dt.types ? Array.from(dt.types).join(', ') : '(未知)';
  return { files: out, types: types };
}

function addFiles(fileList, dt) {
  const got = dt !== undefined ? filesFrom(dt) : { files: Array.from(fileList || []), types: 'File 对象' };
  const files = got.files;
  if (!files.length) {
    // 把浏览器实际给的类型显示出来 —— 这是判断「环境问题」还是「用法问题」的关键
    say('<div class="line err">没能取到文件内容。<br>' +
        '浏览器这次给的数据类型是：<b>' + esc(got.types) + '</b><br>' +
        '如果是 <b>text/uri-list</b> 或空，说明是拖拽环境的问题（Linux 上跨 Wayland/X11 ' +
        '拖拽偶尔会这样），改用下面的「点击选择文件」即可。</div>');
    return;
  }
  const rejected = [];
  let n = 0;
  for (const f of files) {
    if (!isMd(f)) { rejected.push(f.name || '(未命名)'); continue; }
    queue.push({ id: ++seq, file: f, name: uniqueName(f.name),
                 addedAt: Date.now(), checked: true, done: false });
    n++;
  }
  if (n) { $('status').innerHTML = ''; render(); }
  // 被拒绝的一定要说出来 —— 静默跳过会让用户以为"拖进去没反应"
  if (rejected.length) {
    say('<div class="line err">只支持 .md / .markdown / .txt，这几个没加进来：' +
        rejected.map(esc).join('、') + '</div>');
  }
}

function say(html) { $('status').innerHTML = html; }

// 拖拽绑在**整个页面**上 —— 只绑方框的话，用户拖到框外浏览器会直接打开文件，
// 页面跳走，只能刷新回来（用户报过）。
for (const t of ['dragenter', 'dragover']) {
  window.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); });
}
window.addEventListener('dragleave', e => {
  if (!e.relatedTarget) drop.classList.remove('over');
});
window.addEventListener('drop', e => {
  e.preventDefault();
  drop.classList.remove('over');
  addFiles(null, e.dataTransfer);
});

/* ---------- 粘贴文本 ----------
   做法是**合成一个 File 对象，走现有队列** —— 后面的转换、勾选、下载、
   错误提示全都复用，不新增任何转换逻辑。
   文件名从正文第一个 `#` 标题取（粘贴的论文第一行通常就是标题），
   取不到就退回「粘贴的内容」。 */
$('pasteToggle').onclick = () => {
  const panel = $('pastePanel');
  panel.hidden = !panel.hidden;
  $('pasteToggle').textContent = (panel.hidden ? '▾ ' : '▴ ') + '或者直接粘贴 markdown 文本';
  if (!panel.hidden) $('pasteText').focus();
};

// 从正文里找第一个一级标题当文件名。去掉 markdown 记号和不适合做文件名的字符。
function titleFromMd(text) {
  const m = text.match(/^\s*#\s+(.+?)\s*$/m);
  if (!m) return '';
  let n = m[1].replace(/[*_`#\[\]]/g, '').replace(/[\\/:*?"<>|]/g, '').trim();
  return n.length > 40 ? n.slice(0, 40) : n;
}

$('pasteAdd').onclick = () => {
  const text = $('pasteText').value;
  if (!text.trim()) {
    say('<div class="line err">文本框是空的，先粘贴一点内容。</div>');
    return;
  }
  if (text.length > 5 * 1024 * 1024) {
    say('<div class="line err">内容超过 5 MB，请改成分文件上传。</div>');
    return;
  }
  const base = titleFromMd(text) || '粘贴的内容';
  addFiles([new File([text], base + '.md', { type: 'text/markdown' })]);

  // 加进队列后收起面板并清空 —— 默认视图恢复干净，要看结果看队列就行
  $('pasteText').value = '';
  $('pastePanel').hidden = true;
  $('pasteToggle').textContent = '▾ 或者直接粘贴 markdown 文本';
};

/* ---------- 相对时间 ---------- */
function ago(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return '刚刚';
  const m = Math.floor(s / 60);
  if (m < 60) return m + ' 分钟前';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' 小时前';
  return Math.floor(h / 24) + ' 天前';
}

/* ---------- 渲染队列 ---------- */
function render() {
  queue.sort((a, b) => b.addedAt - a.addedAt);

  // 焦点切换：没文件时拖拽区是主角；有文件后收成一行，让位给列表和按钮
  const compact = queue.length > 0;
  drop.classList.toggle('compact', compact);
  if (drop.dataset.mode !== String(compact)) {
    drop.dataset.mode = String(compact);
    drop.innerHTML = compact
      ? '<div class="big">＋ 继续添加 md 文件（也可以拖到页面任意位置）</div>'
      : '<div class="big">拖拽 .md 文件到这里，可以一次拖多个</div>' +
        '<div class="small">也可以点击选择文件</div>';
  }

  listEl.innerHTML = queue.map(it =>
    '<div class="item' + (it.done ? ' done' : '') + '">' +
      '<input type="checkbox" data-id="' + it.id + '"' +
             (it.checked ? ' checked' : '') + (running ? ' disabled' : '') + '>' +
      '<span class="name" title="' + esc(it.name) + '">' + esc(it.name) + '</span>' +
      '<span class="meta">' + ago(it.addedAt) + '</span>' +
      '<span class="x" data-del="' + it.id + '" title="移除">×</span>' +
    '</div>').join('');

  const picked = queue.filter(it => it.checked).length;
  goBtn.disabled = running || picked === 0;
  goBtn.textContent = picked > 1 ? '转换并下载 ' + picked + ' 个文件' : '转换并下载 Word';
}

listEl.addEventListener('change', e => {
  if (e.target.type !== 'checkbox') return;
  const it = queue.find(x => x.id === +e.target.dataset.id);
  if (it) { it.checked = e.target.checked; render(); }
});
listEl.addEventListener('click', e => {
  if (!e.target.dataset.del) return;
  queue = queue.filter(x => x.id !== +e.target.dataset.del);
  render();
});
setInterval(render, 30000);

/* ---------- 模板 ---------- */
fetch('templates').then(r => r.json()).then(d => {
  defaultTpl = (d.templates || [])[0] || '';
  renderTpl();
}).catch(() => { $('tplName').textContent = '模板：读取失败'; });

function renderTpl() {
  if (tplFile) {
    $('tplName').innerHTML = '模板：<b>' + esc(tplFile.name) + '</b>';
    $('tplPick').style.display = 'none';
    $('tplReset').style.display = '';
  } else {
    $('tplName').innerHTML = defaultTpl
      ? '模板：<b>' + esc(defaultTpl.replace(/\.docx$/i, '')) + '</b>'
      : '没有可用模板';
    $('tplPick').style.display = '';
    $('tplReset').style.display = 'none';
  }
}
$('tplPick').onclick = () => $('tplFile').click();
$('tplFile').onchange = () => { const f = $('tplFile').files[0];
                                if (f) { tplFile = f; renderTpl(); } };
$('tplReset').onclick = () => { tplFile = null; $('tplFile').value = ''; renderTpl(); };

/* ---------- 工具 ---------- */
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  return url;
}
function details(items) {
  return '<ul>' + items.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
}

/* ---------- 转换一个文件 ---------- */
async function convertOne(item) {
  const fd = new FormData();
  fd.append('file', item.file, item.name);
  if (tplFile) fd.append('template_file', tplFile);
  else if (defaultTpl) fd.append('template', defaultTpl);

  const r = await fetch('convert', { method: 'POST', body: fd });
  if (!r.ok) {
    let msg = 'HTTP ' + r.status;
    try {
      const j = await r.json();
      msg = j.error || msg;
      // detail 里往往才是能照做的指引（比如「没有模板该怎么办」），别吞掉
      if (j.detail) msg += '\n\n' + j.detail;
    } catch (_) {}
    throw new Error(msg);
  }

  let rep = { warnings: [], changes: [], guesses: [], stats: [] };
  const raw = r.headers.get('X-Report');
  if (raw) {
    try {
      const bytes = Uint8Array.from(atob(raw), c => c.charCodeAt(0));
      rep = JSON.parse(new TextDecoder('utf-8').decode(bytes));
    } catch (_) {}
  }

  const blob = await r.blob();
  const name = (item.name.replace(/\.(md|markdown|txt)$/i, '') || 'output') + '.docx';
  const url = download(blob, name);       // 已经点了转换，不再让他点第二次
  return { name, size: blob.size, url, rep };
}

/* ---------- 渲染转换结果 ----------
   成功：只给一行「文件名（大小）」，细节收在「详情」后面。
        有需要用户确认的地方才额外标一个 ⚠（那是可能出错的地方，不能藏）。
   失败：直接摊开错误原因。 */
function resultHTML(res) {
  const nChange = (res.rep.changes || []).length;
  const nGuess  = (res.rep.guesses || []).length;
  const nWarn   = (res.rep.warnings || []).length;
  const nStat   = (res.rep.stats || []).length;

  let h = '<div class="line ok"><span class="fname">' + esc(res.name) + '</span>' +
          '（' + (res.size/1024).toFixed(0) + ' KB）';
  if (nGuess) h += ' <span class="flag">⚠ ' + nGuess + ' 处需确认</span>';
  const hasToc = (res.rep.stats || []).some(s => s.label === '目录');

  const bits = [];
  if (nStat)   bits.push('识别结果');
  if (nChange) bits.push(nChange + ' 处自动修正');
  if (nWarn)   bits.push(nWarn + ' 条提示');
  if (nGuess)  bits.push(nGuess + ' 处需确认');
  // 目录页码是域更新的产物：WPS 不会打开就更新，必须用户按一次 F9。
  // 这是**必须让用户看到**的一句话（否则他会以为目录坏了），所以放到成功行上 ——
  // 但只在这篇真的生成了目录时才说。
  if (hasToc)  bits.push('页码按 F9 更新');
  if (bits.length) h += ' · <span class="tog">' + bits.join('，') + '</span>';
  h += '</div>';

  if (bits.length) {
    let d = '';
    if (hasToc)  d += '<b>目录页码：</b>' + details([
                   '打开文档后，在目录上右键「更新域」（或按 F9）才会出现 —— ' +
                   '文档里已经存好了目录条目，只是页码要由 Word/WPS 排版时算出来。']);
    if (nStat)   d += '<b>识别结果：</b>' + statRows(res.rep.stats);
    if (nGuess)  d += '<b>需要你确认：</b>' + details(res.rep.guesses);
    if (nWarn)   d += '<b>提示：</b>' + details(res.rep.warnings);
    if (nChange) d += '<b>已自动修正：</b>' + details(res.rep.changes);
    h += '<div class="more" hidden>' + d +
         '<div><a href="' + res.url + '" download="' + esc(res.name) +
         '">手动下载</a></div></div>';
  }
  return h;
}

/* 「识别结果」—— 他这篇里读到了什么（大标题/章节/公式/表格/图片/目录）。
   识别错了（大标题挑错、章节数不对）在这里当场就能看出来。 */
function statRows(stats) {
  return '<ul>' + stats.map(s =>
    '<li>' + esc(s.label) + '：' + esc(s.message) + '</li>').join('') + '</ul>';
}

/* ---------- 转换选中的 ---------- */
goBtn.onclick = async () => {
  const picked = queue.filter(it => it.checked);
  if (!picked.length || running) return;

  running = true;
  render();
  $('status').innerHTML = '<div class="line">正在转换…</div>';

  let out = '';
  for (const it of picked) {
    try {
      const res = await convertOne(it);
      it.done = true;
      it.checked = false;                  // 转完自动取消勾选
      out += resultHTML(res);
    } catch (e) {
      out += '<div class="line err"><span class="fname">' + esc(it.name) +
             '</span>：' + esc(e.message) + '</div>';
    }
    $('status').innerHTML = out;
    render();
    await new Promise(r => setTimeout(r, 400));   // 多个下载之间留点间隔
  }

  running = false;
  render();
};

/* 「详情」展开/收起 —— 事件委托，免得每次重渲染都要重新绑定 */
$('status').addEventListener('click', e => {
  if (!e.target.classList.contains('tog')) return;
  const more = e.target.closest('.line').nextElementSibling;
  if (more && more.classList.contains('more')) more.hidden = !more.hidden;
});
</script>
</body>
